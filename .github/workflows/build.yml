name: build textos project
run-name: build
on:
  push:
    tags:
      - 'buildable-*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Find out the latest buildable tag
        if: github.event_name != 'push'
        uses: oprypin/find-latest-tag@v1
        with:
          repository: ${{ github.repository }}
          releases-only: false
          prefix: 'buildable-'
          sort-tags: true
        id: find_latest_buildable_tag
      - name: Resolve buildable tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          LATEST: ${{ steps.find_latest_buildable_tag.outputs.tag }}
        run: |
          if [ "$EVENT" = "push" ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout TextOS source tree
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ steps.tag.outputs.tag }}
      - name: Configure git identity
        run: |
          git config --global user.name "textos-ci"
          git config --global user.email "ci@textos.local"
      - name: Install essential compilers or softwares
        run: |
          sudo apt-get update
          sudo apt-get install make gcc g++ nasm patchelf
          sudo apt-get install python3 python-is-python3 uuid-dev
      - name: Build BaseTools for Edk2 project
        run: |
          export BUILD_CC="gcc -std=gnu99"
          make -C src/boot/Edk2/BaseTools/Source/C
      - name: Build kernel, boot, app
        run: |
          make -C src kernel boot app
          make -C src install
      - name: Archive with tar
        run: |
          cd build && tar -czvf ../root.tar.gz root
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: root.tar.gz
          path: root.tar.gz
          compression-level: 0
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: root.tar.gz
          fail_on_unmatched_files: true
